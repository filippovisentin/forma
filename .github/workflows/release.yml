name: release
# Builds forma.exe on Windows and publishes it as a GitHub Release.
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.1.0 (empty = build-N prerelease)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write  # Required for cosign keyless signing

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      # OpenCascade (solid kernel) include/ and lib/, cached by the ci workflow's occt
      # job; built from source (~1 h) when the cache is missing. Linked statically.
      FORMA_OCCT_DIR: ${{ github.workspace }}/.occt
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore OCCT build
        uses: actions/cache/restore@v4
        with:
          path: .occt
          key: occt-7.8.1-static-${{ runner.os }}-v1
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        run: |
          cargo cyclonedx -p forma -p forma-cli --features forma/occt,forma-cli/occt --output-file dist/sbom.json
          cargo cyclonedx -p forma -p forma-cli --features forma/occt,forma-cli/occt --output-file dist/sbom.xml --format xml
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! cargo build --release -p forma -p forma-cli --features forma/occt,forma-cli/occt,forma/auditable,forma-cli/auditable 2>&1 | tee build.log; then
            msg=$(grep -E "error|LNK[0-9]|fatal" build.log | tail -30 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=release build::${msg}"
            exit 1
          fi
          rm -rf target/OCCT  # CMake build tree of a cache miss; .occt/ has what we link
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/Forma
          cp target/release/forma.exe target/release/forma-cli.exe dist/Forma/
          cp packaging/LEGGIMI.txt "packaging/Crea collegamento sul Desktop.bat" dist/Forma/
          cp LICENSE-MIT LICENSE-APACHE ATTRIBUTION.md dist/Forma/
          cp -r packaging/licenses dist/Forma/
          # Include SBOMs in the package
          cp dist/sbom.json dist/sbom.xml dist/Forma/
          cd dist && 7z a -tzip Forma-windows.zip Forma > /dev/null
      - name: Sign Windows executables (EV certificate)
        if: env.SIGNING_CERT_PFX != ''
        env:
          SIGNING_CERT_PFX: ${{ secrets.SIGNING_CERT_PFX }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          # Decode base64 certificate
          [System.IO.File]::WriteAllBytes("cert.pfx", [System.Convert]::FromBase64String($env:SIGNING_CERT_PFX))
          # Sign with signtool (requires Windows SDK)
          $timestampUrl = "http://timestamp.digicert.com"
          signtool sign /f cert.pfx /p $env:SIGNING_CERT_PASSWORD /tr $timestampUrl /td sha256 /fd sha256 dist/Forma/forma.exe
          signtool sign /f cert.pfx /p $env:SIGNING_CERT_PASSWORD /tr $timestampUrl /td sha256 /fd sha256 dist/Forma/forma-cli.exe
          # Re-package with signed binaries
          cd dist && 7z a -tzip Forma-windows.zip Forma > /dev/null
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign artifacts with cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign-blob --yes --output-signature dist/forma.exe.sig dist/Forma/forma.exe
          cosign sign-blob --yes --output-signature dist/forma-cli.exe.sig dist/Forma/forma-cli.exe
          cosign sign-blob --yes --output-signature dist/Forma-windows.zip.sig dist/Forma-windows.zip
          cosign sign-blob --yes --output-signature dist/sbom.json.sig dist/sbom.json
          cosign sign-blob --yes --output-signature dist/sbom.xml.sig dist/sbom.xml
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ format('Forma {0}', github.ref_type == 'tag' && github.ref_name || inputs.version || format('build {0}', github.run_number)) }}
          # Versioned releases become "Latest" (README download links use /releases/latest).
          prerelease: ${{ !(github.ref_type == 'tag' || inputs.version != '') }}
          make_latest: ${{ github.ref_type == 'tag' || inputs.version != '' }}
          files: |
            dist/Forma-windows.zip
            dist/Forma/forma.exe
            dist/Forma/forma-cli.exe
            dist/sbom.json
            dist/sbom.xml
            dist/forma.exe.sig
            dist/forma-cli.exe.sig
            dist/Forma-windows.zip.sig
            dist/sbom.json.sig
            dist/sbom.xml.sig
          body: |
            **Download `Forma-windows.zip`**, extract it and double-click `forma.exe`.
            Open a `.3dm` with Ctrl+O or drag it onto the window.

            ${{ env.SIGNING_CERT_PFX != '' && '✅ Windows executables are code-signed with EV certificate (no SmartScreen warning).' || '⚠️ Windows executables are NOT code-signed. Windows may show "Windows protected your PC" — click **More info → Run anyway**.' }}

            **Supply chain verification (cosign keyless signatures):**
            - `forma.exe.sig` — signature for `forma.exe`
            - `forma-cli.exe.sig` — signature for `forma-cli.exe`
            - `Forma-windows.zip.sig` — signature for the zip package
            - `sbom.json.sig` / `sbom.xml.sig` — signatures for SBOMs
            
            Verify with: `cosign verify-blob --signature <file>.sig <file>`

            **SBOM (Software Bill of Materials):**
            - `sbom.json` (CycloneDX JSON)
            - `sbom.xml` (CycloneDX XML)

            Built from ${{ github.sha }}.