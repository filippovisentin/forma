name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask ci
        shell: bash
        run: |
          set -o pipefail
          if ! cargo xtask ci 2>&1 | tee ci.log; then
            # Surface the relevant lines as one annotation (readable via the API).
            msg=$(grep -E "error|LNK[0-9]|fatal|failed|panicked|undefined" ci.log | grep -v "warning C" | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=xtask ci::${msg}"
            exit 1
          fi
