# cargo-deny configuration
# https://github.com/EmbarkStudios/cargo-deny

[advisories]
# Vulnerability database to use
db-urls = ["https://github.com/RustSec/advisory-db"]
# Ignore specific vulnerabilities (by ID)
ignore = [
  # ttf-parser is unmaintained but no safe upgrade available yet
  # RUSTSEC-2026-0192: tracked upstream migration to skrifa
  "RUSTSEC-2026-0192",
]

[licenses]
# Allow these licenses (SPDX identifiers)
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "LGPL-2.1-only WITH openvpn-openssl-exception",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
]

# Skip bans check - too many transitive dependencies to manage
# Run `cargo deny check bans` manually if needed